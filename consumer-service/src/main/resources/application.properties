spring.application.name=consumer-service
server.address=127.0.0.1
server.port=8092
management.endpoints.web.exposure.include=health,info
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.function.definition=consume
spring.cloud.stream.bindings.consume-in-0.destination=page-events
spring.cloud.stream.bindings.consume-in-0.group=console-observer
spring.cloud.stream.bindings.consume-in-0.content-type=text/plain
