spring.application.name=producer-service
server.address=127.0.0.1
server.port=8091
management.endpoints.web.exposure.include=health,info
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.stream.output-bindings=events-out-0
spring.cloud.stream.bindings.events-out-0.destination=page-events
spring.cloud.stream.bindings.events-out-0.content-type=text/plain
