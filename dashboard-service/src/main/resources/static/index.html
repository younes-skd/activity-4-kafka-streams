<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kafka · Temps réel</title><style>body{font:18px system-ui;background:#0d1d32;color:#edf6ff;margin:4rem auto;max-width:900px;padding:0 1rem}h1{font-size:3rem}.status{color:#83dac8}.card{background:#19354f;border-radius:16px;padding:2rem;margin:1rem 0}.row{display:flex;justify-content:space-between;padding:1rem;border-bottom:1px solid #456}progress{width:50%}code{background:#294763;padding:.25rem}a{color:#a3e0ff}</style><p>EMSI / KAFKA STREAMS</p><h1>Le trafic, en direct.</h1><p id="status" class="status" role="status">Connexion…</p><div class="card" id="counts">En attente d'événements.</div><p>Producer → page-events → Kafka Streams → page-counts → SSE</p><p>Envoyez un événement à <code>POST localhost:8091/events</code> avec <code>{"page":"home"}</code>, ou démarrez le Supplier.</p><script>const status=document.querySelector('#status'),counts=document.querySelector('#counts');const stream=new EventSource('/api/stream');stream.onopen=()=>status.textContent='Connecté · mises à jour en temps réel';stream.onerror=()=>status.textContent='Reconnexion en cours…';stream.addEventListener('counts',e=>{const data=JSON.parse(e.data),max=Math.max(1,...Object.values(data));counts.replaceChildren();for(const [page,count] of Object.entries(data)){const row=document.createElement('div');row.className='row';const label=document.createElement('strong');label.textContent=page;const bar=document.createElement('progress');bar.max=max;bar.value=count;const number=document.createElement('span');number.textContent=count;row.append(label,bar,number);counts.append(row)}if(!Object.keys(data).length)counts.textContent="En attente d'événements."})</script></html>
