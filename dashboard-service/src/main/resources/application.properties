spring.application.name=dashboard-service
server.address=127.0.0.1
server.port=8095
management.endpoints.web.exposure.include=health,info
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.function.definition=display
spring.cloud.stream.bindings.display-in-0.destination=page-counts
spring.cloud.stream.bindings.display-in-0.group=dashboard
spring.cloud.stream.bindings.display-in-0.content-type=text/plain
