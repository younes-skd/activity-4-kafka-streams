spring.application.name=analytics-service
server.address=127.0.0.1
server.port=8094
management.endpoints.web.exposure.include=health,info
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.function.definition=pageCounts
spring.cloud.stream.kafka.streams.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.stream.kafka.streams.binder.application-id=page-counts-v1
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000
spring.cloud.stream.kafka.streams.binder.configuration.statestore.cache.max.bytes=0
spring.cloud.stream.bindings.pageCounts-in-0.destination=page-events
spring.cloud.stream.bindings.pageCounts-out-0.destination=page-counts
spring.cloud.stream.kafka.streams.bindings.pageCounts-in-0.consumer.key-serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.cloud.stream.kafka.streams.bindings.pageCounts-in-0.consumer.value-serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.cloud.stream.kafka.streams.bindings.pageCounts-out-0.producer.key-serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.cloud.stream.kafka.streams.bindings.pageCounts-out-0.producer.value-serde=org.apache.kafka.common.serialization.Serdes$StringSerde
