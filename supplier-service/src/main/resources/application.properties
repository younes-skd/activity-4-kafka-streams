spring.application.name=supplier-service
server.address=127.0.0.1
server.port=8093
management.endpoints.web.exposure.include=health,info
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.function.definition=pageSupplier
spring.cloud.stream.bindings.pageSupplier-out-0.destination=page-events
spring.cloud.stream.bindings.pageSupplier-out-0.content-type=text/plain
spring.cloud.stream.poller.fixed-delay=1000
